<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg:#f7f2e8; --ink:#171717; --ink2:#55585e; --hair:#cdc7ba; --accent:#063caf; --accent2:#e85b2a;
          --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Arial,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:var(--sans); }
  #map { position:absolute; inset:0; background:var(--bg); }

  .topbar { position:absolute; z-index:500; top:0; left:0; right:0; padding:calc(env(safe-area-inset-top) + 10px) 12px 0;
            pointer-events:none; }
  .titlebar { pointer-events:auto; display:flex; align-items:center; justify-content:space-between; gap:10px;
              background:var(--bg); border:1px solid var(--hair); border-radius:14px; padding:9px 14px;
              box-shadow:0 2px 10px rgba(0,0,0,.12); }
  .titlebar b { font-size:.95rem; }
  .titlebar a { color:var(--accent); text-decoration:none; text-align:right; line-height:1.2; padding:2px 0 2px 8px; }
  .titlebar a span { display:block; font-size:1rem; font-weight:700; }
  .titlebar a small { display:block; font-size:.68rem; color:var(--ink2); }
  .chips { pointer-events:auto; display:flex; gap:7px; overflow-x:auto; padding:9px 2px 4px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; border:1px solid var(--hair); background:var(--bg); color:var(--ink); border-radius:999px;
          padding:7px 14px; font:600 .82rem var(--sans); box-shadow:0 1px 5px rgba(0,0,0,.12); }
  .chip.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }

  .fab { position:absolute; z-index:500; right:12px; width:46px; height:46px; border-radius:50%; border:1px solid var(--hair);
         background:var(--bg); box-shadow:0 2px 10px rgba(0,0,0,.2); display:flex; align-items:center; justify-content:center; }
  #locate { bottom:calc(var(--sheet-h, 96px) + 16px); transition:bottom .25s; }
  .fab svg { width:22px; height:22px; fill:none; stroke:var(--accent); stroke-width:2; }
  .fab.active svg { fill:var(--accent); }

  .legend { position:absolute; z-index:400; left:12px; bottom:calc(var(--sheet-h, 96px) + 16px); transition:bottom .25s;
            background:var(--bg); border:1px solid var(--hair); border-radius:10px; padding:6px 10px; font-size:.7rem;
            color:var(--ink2); box-shadow:0 1px 6px rgba(0,0,0,.15); }
  .legend i { display:block; height:7px; width:120px; border-radius:4px; margin:3px 0 2px;
              background:linear-gradient(90deg,rgb(50,205,50),rgb(255,215,0),rgb(220,53,69)); }
  .legend span { display:flex; justify-content:space-between; }

  .sheet { position:absolute; z-index:600; left:0; right:0; bottom:0; background:var(--bg); border-radius:18px 18px 0 0;
           box-shadow:0 -3px 16px rgba(0,0,0,.22); height:96px; transition:height .25s; display:flex; flex-direction:column;
           padding-bottom:env(safe-area-inset-bottom); }
  .sheet.list { height:64vh; }
  .sheet.card { height:auto; max-height:75vh; }
  .grab { flex:none; padding:9px 0 3px; display:flex; justify-content:center; cursor:pointer; }
  .grab i { width:38px; height:4px; border-radius:2px; background:#b9b3a6; }
  .peek { flex:none; padding:2px 16px 12px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .peek b { font-size:1rem; }
  .peek small { color:var(--ink2); font-size:.8rem; display:block; margin-top:2px; }
  .peek .more { color:var(--accent); font-size:.8rem; font-weight:600; }
  .sheet.card .peek, .sheet.card #rows { display:none; }
  .sheet:not(.card) #card { display:none; }
  .sheet:not(.list) #rows { display:none; }
  #rows { flex:1; overflow-y:auto; border-top:1px solid var(--hair); }
  .row { display:flex; gap:12px; padding:11px 16px; border-bottom:1px solid var(--hair); }
  .row img, .row .noimg { width:78px; height:60px; object-fit:cover; border-radius:8px; background:#e6dfd0; flex:none; }
  .row .r1 { font-weight:700; font-size:.98rem; }
  .row .r2 { color:var(--ink2); font-size:.8rem; margin-top:2px; }
  .row .d { margin-left:auto; color:var(--accent); font-weight:600; font-size:.8rem; white-space:nowrap; }
  .note { padding:14px 16px; color:var(--ink2); font-size:.85rem; }

  #card { overflow-y:auto; }
  #card .ph { width:100%; height:190px; object-fit:cover; background:#e6dfd0; display:block; }
  #card .body { padding:12px 16px 16px; }
  #card .price { font-size:1.45rem; font-weight:800; }
  #card .sub { color:var(--ink2); font-size:.9rem; margin-top:3px; }
  #card .facts { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .fact { background:#ece5d7; border-radius:8px; padding:5px 9px; font-size:.8rem; }
  .fact.new { background:var(--accent2); color:#fff; font-weight:700; }
  .btns { display:flex; gap:10px; margin-top:14px; }
  .btn { flex:1; text-align:center; padding:12px; border-radius:12px; font:700 .92rem var(--sans); text-decoration:none;
         border:1px solid var(--ink); background:var(--ink); color:var(--bg); }
  .btn.alt { background:transparent; color:var(--ink); border-color:var(--hair); }

  @media (min-width: 900px) {
    .sheet { right:auto; width:420px; left:12px; bottom:12px; border-radius:18px; }
    .sheet.list { height:70vh; }
    #locate, .legend { bottom:16px; }
  }
  .me { background:#1a73e8; border:3px solid #fff; border-radius:50%; box-shadow:0 0 0 2px rgba(26,115,232,.35), 0 1px 5px rgba(0,0,0,.4); }
  .leaflet-control-attribution { font-size:9px; opacity:.8; }
  .leaflet-container { font-family:var(--sans); }
</style>
</head>

const TYPES = ["home", "land", "rent"];
const CENTRE = [38.96622, -9.41204];
const LO = 2500, HI = 5000;
const TILE_OPACITY = 0.75;
const NEAR_KM = 25;      // beyond this, GPS is treated as "not in Ericeira"

if (location.protocol === 'file:') document.getElementById('back').href = 'dashboard.html?full=1';

const CLS = { Urban: '#2c7be5', Urbanisable: '#e25c2c', Rural: '#6b7280' };
const SCALE = { home: [LO, HI], rent: [8, 20] };
function colour(r) {
  if (r.ty === 'land') return CLS[r.cl] || '#9a9a9a';
  const ppm = r.ppm;
  if (!ppm) return '#9a9a9a';
  const [lo, hi] = SCALE[r.ty];
  const t = Math.max(0, Math.min(1, (ppm - lo) / (hi - lo)));
  const a = [50,205,50], b = [255,215,0], c = [220,53,69];
  const [p, q, u] = t < .5 ? [a, b, t * 2] : [b, c, (t - .5) * 2];
  return 'rgb(' + p.map((v, i) => Math.round(v + (q[i] - v) * u)).join(',') + ')';
}
const eur = n => '€' + n.toLocaleString('en-US');
function dist(a, b, c, d) {
  const R = 6371000, r = Math.PI / 180, dl = (c - a) * r, dn = (d - b) * r;
  const h = Math.sin(dl/2)**2 + Math.cos(a*r) * Math.cos(c*r) * Math.sin(dn/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtD = m => m < 1000 ? (Math.round(m / 10) * 10) + ' m' : (m / 1000).toFixed(1) + ' km';

const map = L.map('map', { zoomControl: false, preferCanvas: true, attributionControl: true }).setView(CENTRE, 14);
L.tileLayer("https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}@2x.png?key=cb1_33o6_1_1e21ac00c5841a351504d9b4", {
  maxZoom: 19, opacity: TILE_OPACITY, attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
}).addTo(map);

let ty = 'home', filt = 'All', ref = { la: CENTRE[0], lo: CENTRE[1], kind: 'centre' }, selected = null;
let youMarker = null, youRing = null, spotMarker = null, watching = false;

const baseR = () => { const z = map.getZoom(); return z >= 16 ? 10 : z >= 15 ? 8 : z >= 14 ? 6 : 4.5; };
const markers = new Map();
D.forEach(r => {
  const m = L.circleMarker([r.la, r.lo], {
    radius: baseR(), weight: r.new ? 2.5 : 1, color: r.new ? '#000' : '#fff',
    fillColor: colour(r), fillOpacity: .92, bubblingMouseEvents: false
  });
  m.on('click', () => select(r.id));
  markers.set(r.id, m);
});

const NAMES = { home: 'Homes', land: 'Terrenos', rent: 'Rentals' };
const NOUN = { home: ['home', 'homes'], land: ['plot', 'plots'], rent: ['rental', 'rentals'] };
const CHIPS = { home: ['All', 'T1', 'T2', 'T3', 'T4+', 'New'], land: ['All', 'Urban', 'Urbanisable', 'Rural'],
                rent: ['All', 'T0', 'T1', 'T2', 'T3+'] };
const chipsEl = document.getElementById('chips'), typesEl = document.getElementById('types');
function drawChips() {
  chipsEl.innerHTML = '';
  CHIPS[ty].forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip' + (c === filt ? ' on' : ''); b.textContent = c === 'New' ? 'New this month' : c;
    b.onclick = () => { filt = c; drawChips(); refresh(); };
    chipsEl.appendChild(b);
  });
}
function drawLegend() {
  const el = document.getElementById('legend');
  const bar = '<i></i>';
  el.innerHTML = ty === 'land'
    ? Object.keys(CLS).map(k => '<span style="justify-content:flex-start;gap:6px;align-items:center"><b style="width:9px;height:9px;border-radius:50%;background:' + CLS[k] + '"></b>' + k + '</span>').join('')
    : ty === 'rent'
      ? '<span><em>&euro;/m&sup2; living, per month</em></span>' + bar + '<span><em>&euro;' + SCALE.rent[0] + '</em><em>&euro;' + SCALE.rent[1] + '+</em></span>'
      : '<span><em>&euro;/m&sup2; gross</em></span>' + bar + '<span><em>&euro;' + LO + '</em><em>&euro;' + HI + '+</em></span>';
}
TYPES.forEach(t => {
  const b = document.createElement('button');
  b.className = 'chip' + (t === ty ? ' on' : ''); b.textContent = NAMES[t]; b.dataset.t = t;
  b.onclick = () => {
    ty = t; filt = 'All'; selected = null; setSheet('peek');
    [...typesEl.children].forEach(x => x.classList.toggle('on', x.dataset.t === t));
    document.getElementById('ttl').textContent = NAMES[t] + ' around you';
    drawChips(); drawLegend(); refresh(); fitType();
  };
  typesEl.appendChild(b);
});
if (TYPES.length < 2) typesEl.style.display = 'none';
function fitType() {
  const pts = D.filter(r => r.ty === ty).map(r => [r.la, r.lo]);
  if (pts.length && !youMarker) map.fitBounds(L.latLngBounds(pts).pad(0.05), { paddingTopLeft: [0, 160], paddingBottomRight: [0, 110] });
}
function passes(r) {
  if (r.ty !== ty) return false;
  if (filt === 'All') return true;
  if (ty === 'land') return r.cl === filt;
  if (ty === 'rent') { const n = r.t ? parseInt(r.t.slice(1)) : -1; return filt === 'T3+' ? n >= 3 : r.t === filt; }
  if (filt === 'New') return r.new;
  const n = r.t ? parseInt(r.t.slice(1)) : -1;
  return filt === 'T4+' ? n >= 4 : r.t === filt;
}

const sheet = document.getElementById('sheet');
function setSheet(state) {
  sheet.className = 'sheet ' + (state === 'peek' ? '' : state);
  requestAnimationFrame(() => document.documentElement.style.setProperty('--sheet-h', Math.min(sheet.offsetHeight, 140) + 'px'));
  document.getElementById('more').textContent = state === 'list' ? 'Hide list' : 'See list';
}
document.getElementById('grab').onclick = document.getElementById('peek').onclick =
  () => setSheet(sheet.classList.contains('list') ? 'peek' : 'list');

function refresh() {
  const vis = D.filter(passes).map(r => ({ r, d: dist(ref.la, ref.lo, r.la, r.lo) })).sort((a, b) => a.d - b.d);
  markers.forEach((m, id) => { map.removeLayer(m); });
  vis.forEach(v => markers.get(v.r.id).addTo(map));
  const label = { you: 'from your location', spot: 'from the spot you tapped', centre: 'from the centre of Ericeira' }[ref.kind];
  document.getElementById('count').textContent = vis.length + ' ' + NOUN[ty][vis.length === 1 ? 0 : 1];
  document.getElementById('where').textContent = !vis.length ? 'No match for this filter'
    : ref.kind === 'centre' ? 'Tap the location button to see what is near you' : 'Nearest ' + fmtD(vis[0].d) + ' ' + label;
  const rows = document.getElementById('rows');
  let h = ref.kind === 'centre' ? '<div class="note">Tap the location button for ' + NOUN[ty][1] + ' near you, or tap the map to pick a spot.</div>' : '';
  h += vis.slice(0, 60).map(v => {
    const r = v.r;
    const img = r.ph ? '<img loading="lazy" referrerpolicy="no-referrer" src="' + r.ph + '" alt="">' : '<div class="noimg"></div>';
    return '<div class="row" data-id="' + r.id + '">' + img + '<div><div class="r1">' + eur(r.p) + (r.ty === 'rent' ? '/mo' : '') + '</div><div class="r2">' +
      [r.ty === 'land' ? r.cl : r.t, r.b ? r.b + ' m²' : null, r.z].filter(Boolean).join(' · ') + '</div></div><span class="d">' + fmtD(v.d) + '</span></div>';
  }).join('');
  rows.innerHTML = h;
  rows.querySelectorAll('.row').forEach(el => el.onclick = () => { select(el.dataset.id, true); });
}

function select(id, fly) {
  const r = D.find(x => x.id === id); if (!r) return;
  selected = id;
  const d = dist(ref.la, ref.lo, r.la, r.lo);
  const facts = [];
  if (r.new) facts.push('<span class="fact new">New this month</span>');
  if (r.ty === 'land') {
    if (r.cl) facts.push('<span class="fact">' + r.cl + '</span>');
    if (r.b) facts.push('<span class="fact">' + r.b.toLocaleString('en-US') + ' m² plot</span>');
    if (r.ppm) facts.push('<span class="fact">' + eur(r.ppm) + '/m²</span>');
  } else {
    if (r.t) facts.push('<span class="fact">' + r.t + '</span>');
    if (r.b) facts.push('<span class="fact">' + r.b + ' m² gross</span>');
    if (r.u) facts.push('<span class="fact">' + r.u + ' m² living</span>');
    if (r.ppm) facts.push('<span class="fact">' + eur(r.ppm) + (r.ty === 'rent' ? '/m² living per month' : '/m² gross') + '</span>');
  }
  if (r.s) facts.push('<span class="fact">Online since ' + r.s + (r.m ? ' · ' + r.m + (r.m === 1 ? ' month' : ' months') : '') + '</span>');
  const img = r.ph ? '<img class="ph" referrerpolicy="no-referrer" src="' + r.ph + '" alt="">' : '';
  document.getElementById('card').innerHTML = img + '<div class="body"><div class="price">' + eur(r.p) + (r.ty === 'rent' ? ' <small style="font-size:.8rem;font-weight:600">per month</small>' : '') + '</div>' +
    '<div class="sub">' + r.k + (r.z ? ' in ' + r.z : '') + (ref.kind !== 'centre' ? ' · ' + fmtD(d) + ' away' : '') + '</div>' +
    '<div class="facts">' + facts.join('') + '</div><div class="btns">' +
    '<a class="btn alt" href="#" id="closeCard">Back</a>' +
    (r.url ? '<a class="btn" target="_blank" rel="noopener" href="' + r.url + '">Open listing</a>' : '') + '</div></div>';
  document.getElementById('closeCard').onclick = e => { e.preventDefault(); deselect(); };
  setSheet('card');
  markers.forEach((m, k) => m.setStyle({ radius: k === id ? baseR() + 5 : baseR() }));
  if (fly) map.flyTo([r.la, r.lo], Math.max(map.getZoom(), 16), { duration: .6 });
  else map.panTo([r.la, r.lo]);
}
function deselect() {
  selected = null; markers.forEach(m => m.setStyle({ radius: baseR() })); setSheet('peek');
}

map.on('zoomend', () => markers.forEach((m, k) => m.setStyle({ radius: k === selected ? baseR() + 5 : baseR() })));
function setRef(la, lo, kind) { ref = { la, lo, kind }; refresh(); }
map.on('click', e => {
  if (selected) return deselect();
  if (youMarker) return;                    // a GPS fix wins over tapped spots
  if (spotMarker) map.removeLayer(spotMarker);
  spotMarker = L.marker(e.latlng).addTo(map);
  setRef(e.latlng.lat, e.latlng.lng, 'spot');
});

const locBtn = document.getElementById('locate');
function onFix(p) {
  const la = p.coords.latitude, lo = p.coords.longitude;
  if (dist(la, lo, CENTRE[0], CENTRE[1]) > NEAR_KM * 1000) {
    document.getElementById('where').textContent = 'You are not near Ericeira. Tap the map to pick a spot instead.';
    return;
  }
  if (spotMarker) { map.removeLayer(spotMarker); spotMarker = null; }
  const first = !youMarker;
  if (!youMarker) {
    youRing = L.circle([la, lo], { radius: p.coords.accuracy, weight: 0, fillColor: '#1a73e8', fillOpacity: .12 }).addTo(map);
    youMarker = L.marker([la, lo], { icon: L.divIcon({ className: '', html: '<div class="me" style="width:18px;height:18px"></div>', iconSize: [18, 18] }), zIndexOffset: 1000 }).addTo(map);
  } else { youMarker.setLatLng([la, lo]); youRing.setLatLng([la, lo]).setRadius(p.coords.accuracy); }
  locBtn.classList.add('active');
  setRef(la, lo, 'you');
  if (first) map.setView([la, lo], 16);
}
function onErr(e) {
  document.getElementById('where').textContent = e.code === 1
    ? 'Location is blocked. Allow it in your browser settings, or tap the map to pick a spot.'
    : 'Could not get your location. Tap the map to pick a spot.';
}
locBtn.onclick = () => {
  if (!navigator.geolocation) return onErr({ code: 2 });
  if (youMarker) { map.setView(youMarker.getLatLng(), 16); return; }
  if (!watching) { watching = true; navigator.geolocation.watchPosition(onFix, onErr, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 }); }
};

drawChips(); drawLegend();
refresh();
setSheet('peek');
const fit = L.latLngBounds(D.filter(r => r.ty === 'home').map(r => [r.la, r.lo])).pad(0.05);
map.fitBounds(fit, { paddingTopLeft: [0, TYPES.length > 1 ? 160 : 110], paddingBottomRight: [0, 110] });
if (navigator.geolocation && navigator.permissions) {
  navigator.permissions.query({ name: 'geolocation' }).then(s => { if (s.state === 'granted') locBtn.click(); }).catch(() => {});
}
</script>
</body>
</html>
